<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: gap: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'">
<meta name="theme-color" content="#0e131d">
<title>CIAO</title>
<link rel="stylesheet" href="css/app.css">
<script src="cordova.js"></script>
</head>
<body>

<!-- ============ CHE LINGUA PARLI? (prima volta) ============ -->
<section id="screen-lang" class="screen hidden">
  <div class="brand"><div class="logo" id="logo2"></div><div><h1>CIAO</h1><div class="tagline">Communicator for Immersive Audio-Oral learning</div></div></div>
  <div id="lang-list"></div>
</section>

<!-- ============ MENU ============ -->
<section id="screen-home" class="screen">
  <div class="brand"><div class="logo" id="logo"></div><div><h1>CIAO</h1><div class="tagline">Communicator for Immersive Audio-Oral learning</div></div></div>
  <div class="card" id="trial-card"></div>

  <div class="label" data-t="labelTeacher">Teacher</div>
  <div id="teacher-list"></div>

  <div id="lang-box"></div>

  <div class="label" data-t="labelLessons">Lessons</div>
  <div id="lesson-list"></div>

  <div class="label" data-t="labelOptions">Options</div>
  <label class="switch"><input type="checkbox" id="opt-text"> <span data-t="optText">Show the sentences in writing</span></label>

  <div style="height:18px"></div>
  <button id="btn-report" class="secondary" data-t="btnReport">Trial results</button>
</section>

<!-- ============ LEZIONE ============ -->
<section id="screen-lesson" class="screen hidden">
  <div id="demo-caption" class="hidden"></div>
  <div class="topbar"><span id="l-title"></span><span id="l-count"></span></div>
  <div id="progress"><div id="progress-fill"></div></div>
  <div id="l-teacher"></div>
  <div id="stage">
    <div id="stage-hand"></div><div id="stage-figure"></div>
    <div id="stage-mark" class="hidden"></div>
    <div id="stage-cue" class="hidden"></div>
  </div>
  <div id="prompt-text"></div>
  <div id="heard"></div>
  <div id="objects-grid"></div>
  <div id="status"><span id="mic-dot"></span><span id="status-text"></span></div>
  <div class="row">
    <button id="btn-replay" class="secondary">Repeat</button>
    <button id="btn-talk">Talk</button>
  </div>
  <button id="btn-exit" class="ghost">Exit</button>
</section>

<!-- ============ FINE LEZIONE ============ -->
<section id="screen-end" class="screen hidden">
  <h2 data-t="lessonComplete">Lesson complete</h2>
  <div class="card result" id="end-body"></div>
  <div style="height:18px"></div>
  <button id="btn-again" data-t="again">Repeat the lesson</button>
  <button id="btn-end-home" class="secondary" data-t="menu">Menu</button>
</section>

<!-- ============ RISULTATI ============ -->
<section id="screen-report" class="screen hidden">
  <h2 data-t="reportTitle">Trial results</h2>
  <div id="report-body"></div>
  <button id="btn-report-home" data-t="menu">Menu</button>
  <button id="btn-reset" class="ghost" data-t="resetAll">Delete all data</button>
</section>

<div id="demo-finger" class="hidden"></div>
<div id="pick-finger" class="hidden"></div>

<!-- Corso (in vendita: un'app per lingua da imparare) -->
<script src="js/course.js"></script>
<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/ui_lang.js"></script>
<script src="js/teacher.js"></script>
<script src="js/voice.js"></script>
<script src="js/storage.js"></script>
<script src="js/demo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
