<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: gap: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'">
<meta name="theme-color" content="#15141f">
<title>Metodo Diretto</title>
<link rel="stylesheet" href="css/app.css">
<script src="cordova.js"></script>
</head>
<body>

<!-- ============ MENU ============ -->
<section id="screen-home" class="screen">
  <div class="brand"><div class="logo" id="logo"></div><h1>Metodo Diretto</h1></div>
  <div class="card" id="trial-card"></div>

  <div class="label">Insegnante</div>
  <div id="teacher-list"></div>

  <div class="label">Lezione</div>
  <div id="lesson-list"></div>

  <div class="label">Opzioni</div>
  <label class="switch"><input type="checkbox" id="opt-text"> Mostra le frasi scritte</label>

  <div style="height:18px"></div>
  <button id="btn-report" class="secondary">Risultati della prova</button>
</section>

<!-- ============ LEZIONE ============ -->
<section id="screen-lesson" class="screen hidden">
  <div id="demo-caption" class="hidden"></div>
  <div class="topbar"><span id="l-title"></span><span id="l-count"></span></div>
  <div id="progress"><div id="progress-fill"></div></div>
  <div id="l-teacher"></div>
  <div id="stage">
    <div id="stage-hand"></div><div id="stage-figure"></div>
    <div id="stage-badge" class="hidden"></div>
  </div>
  <div id="prompt-text"></div>
  <div id="heard"></div>
  <div id="objects-grid"></div>
  <div id="status"><span id="mic-dot"></span><span id="status-text"></span></div>
  <div class="row">
    <button id="btn-replay" class="secondary">Riascolta</button>
    <button id="btn-talk">Parla</button>
  </div>
  <button id="btn-exit" class="ghost">Esci</button>
</section>

<!-- ============ FINE LEZIONE ============ -->
<section id="screen-end" class="screen hidden">
  <h2>Lezione finita</h2>
  <div class="card result" id="end-body"></div>
  <div style="height:18px"></div>
  <button id="btn-again">Ripeti la lezione</button>
  <button id="btn-end-home" class="secondary">Menu</button>
</section>

<!-- ============ RISULTATI ============ -->
<section id="screen-report" class="screen hidden">
  <h2>Risultati della prova</h2>
  <div id="report-body"></div>
  <button id="btn-report-home">Menu</button>
  <button id="btn-reset" class="ghost">Cancella tutti i dati</button>
</section>

<div id="demo-finger" class="hidden"></div>

<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/voice.js"></script>
<script src="js/storage.js"></script>
<script src="js/demo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
